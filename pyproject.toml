[project]
name = "depthwizard"
version = "0.1.0"
description = "Single-view satellite image -> DSM + interactive 3D flythrough (SIH 2026 PS SIH26175)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.4",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.scripts]
depthwizard = "depthwizard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["depthwizard*"]

[tool.setuptools.package-data]
depthwizard = ["static/**/*"]
